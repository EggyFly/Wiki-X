{{define "main"}}
<section class="panel auth-panel">
  <h1>{{.T.verify_title}}</h1>
  <p class="muted">{{.T.verify_hint}}</p>
  <form method="post" action="/verify" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <label class="field">
      <span>{{.T.totp_confirm_code}}</span>
      <input name="totp_code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
    </label>
    <button class="btn btn-primary" type="submit">{{.T.verify_button}}</button>
  </form>
</section>
{{end}}
