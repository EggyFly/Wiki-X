site:
  title: Wiki-X
  description: 开源游戏社区知识引擎
  language: zh-CN
  base_url: http://localhost:8080
  community_ui: false
  locales:
    - code: zh-CN
      label: 中文
      prefix: ""
    - code: en
      label: English
      prefix: en
  nav:
    - title: 首页
      href: /
    - title: 指南
      href: /guide/
content:
  source: git
  dir: examples/basic/content
  max_file_size: 1048576
  reload_interval: 0s
server:
  addr: ":8080"
  access_log: false
cache:
  driver: auto
  ttl: 10m
  max_entries: 2000
  max_bytes: 67108864
  redis:
    addr: ""
    password: ""
    db: 0
    prefix: wiki_x
database:
  url: ""
  max_conns: 10
  auto_migrate: true
auth:
  secure_cookies: false
  session_ttl: 336h
  trusted_proxies: []
media:
  dir: data/media
  max_size: 8388608
  storage: local
theme:
  default: default
  disable_switch: false
comment:
  rate_limit: 5
  rate_window: 1m
  blocked_words: []
registration:
  mode: off
  default_group: user
search:
  backend: auto
  url: ""
  api_key: ""
  index: wiki_x
