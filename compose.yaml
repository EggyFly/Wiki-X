services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: wiki_x
      POSTGRES_USER: wiki_x
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wiki_x-change-me}
    volumes:
      - wiki_x-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki_x -d wiki_x"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://wiki_x:wiki_x-change-me@db:5432/wiki_x?sslmode=disable}
      CONTENT_SOURCE: postgres
      CONTENT_DIR: /data/content
      SITE_COMMUNITY_UI: "true"
      CACHE_DRIVER: redis
      REDIS_ADDR: redis:6379
      MEDIA_DIR: /data/media
      AUDIT_ARCHIVE_DIR: /data/audit
    volumes:
      - ./deploy/wiki_x.yaml:/data/wiki_x.yaml:ro
      - ./examples/basic/content:/data/content:ro
      - wiki_x-media:/data/media
      - wiki_x-audit:/data/audit
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/-/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  wiki_x-db:
  wiki_x-media:
  wiki_x-audit:
