site:
  title: Wiki-X Community Demo
  description: PostgreSQL + accounts + review + multi-skin demo
  language: zh-CN
  base_url: http://localhost:8080
  community_ui: true
  locales:
    - code: zh-CN
      label: 中文
      prefix: ""
    - code: en
      label: English
      prefix: en
  nav:
    - title: 首页
      href: /
    - title: 指南
      href: /guide/
content:
  source: postgres
  dir: ../basic/content
  max_file_size: 1048576
  reload_interval: 0s
server:
  addr: ":8080"
  access_log: false
cache:
  driver: auto
  ttl: 10m
  max_entries: 2000
  max_bytes: 67108864
  redis:
    addr: ""
    password: ""
    db: 0
    prefix: wiki_x-community
database:
  same: true
  maintenance_database: postgres
  primary:
    address: ""
    username: ""
    password: ""
    database: ""
    params: ""
  max_conns: 10
  auto_migrate: false
oidc:
  enabled: false         # 让其他站点用 Wiki-X 账号登录, 需要数据库
  issuer: ""             # 留空使用 site.base_url
  key_encryption_key: "" # 32 字节 base64, 开启时必须填写
  access_ttl: 5m
  id_ttl: 5m
  refresh_ttl: 168h
  code_ttl: 2m
auth:
  secure_cookies: false
  session_ttl: 336h
  trusted_proxies: []
  github:
    client_id: ""
    client_secret: ""
    redirect_url: ""
github:
  webhook_secret: ""
  repo: ""
  token: ""
  app_id: 0
  installation_id: 0
  private_key_file: ""
  base_branch: main
  content_path: ""
  pr_import: pending
  api_base_url: https://api.github.com
media:
  dir: media
  max_size: 8388608
theme:
  default: default
  disable_switch: false
comment:
  rate_limit: 5
  rate_window: 1m
  blocked_words: []
mail:
  host: ""               # 填写后启用邮箱验证和密码找回, site.base_url 必填
  port: 587
  username: ""
  password: ""           # 建议通过 MAIL_PASSWORD 提供
  from: ""
  implicit_tls: false    # 465 端口直连 TLS 时设为 true
registration:
  mode: off              # off, invite, open; open 必须配置邮件
  default_group: user    # 新账号默认用户组
search:
  backend: auto          # auto, memory, postgres, meilisearch
  url: ""                # meilisearch 地址, 例如 http://127.0.0.1:7700
  api_key: ""            # 建议通过 SEARCH_API_KEY 提供
  index: wiki_x           # meilisearch 索引名
